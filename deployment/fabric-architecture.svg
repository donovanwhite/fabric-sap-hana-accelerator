<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SAP Finance Microsoft Fabric solution accelerator</title>
  <desc id="desc">Architecture from SAP Finance source through Fabric ingestion, medallion Lakehouses, Direct Lake semantic model, report, and Data Agent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91efe0"/>
      <stop offset="0.52" stop-color="#82dfc1"/>
      <stop offset="1" stop-color="#95df9c"/>
    </linearGradient>
    <linearGradient id="ribbonMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74cdb9"/>
      <stop offset="1" stop-color="#3e8e78"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#468f80"/>
      <stop offset="1" stop-color="#1f554d"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#82dfc1"/>
    </marker>
    <style>
      .title { font: 700 44px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .subtitle { font: 400 19px "Segoe UI", Arial, sans-serif; fill: #b9c7e6; }
      .section { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #90e5ca; letter-spacing: 2px; }
      .card-title { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .card-text { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #d8e1f4; }
      .small { font: 500 14px "Segoe UI", Arial, sans-serif; fill: #b9c7e6; }
      .pill { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .dark-title { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #172033; }
      .dark-text { font: 500 16px "Segoe UI", Arial, sans-serif; fill: #27364c; }
      .dark-small { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .dark-pill { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .line { fill: none; stroke: #82dfc1; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .thin-line { fill: none; stroke: #64bda6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <text x="80" y="74" class="title">SAP Finance on Microsoft Fabric</text>
  <text x="80" y="108" class="subtitle">Full-snapshot correctness · governed medallion processing · Direct Lake intelligence</text>
  <g transform="translate(1265 34) scale(.30)" filter="url(#shadow)">
    <path d="M18 178L60 62Q69 35 98 30L277 0Q294 -3 289 18L270 94Q267 107 253 110L76 141Q38 148 18 178Z" fill="url(#fabric)"/>
    <path d="M18 178Q27 148 76 141L223 115L202 194Q198 208 183 211L46 235Q18 240 4 261Z" fill="url(#ribbonMid)"/>
    <path d="M4 261Q-5 239 8 213L46 235L132 220L111 300Q107 317 91 320L42 328Q15 333 3 314Q-8 295 4 261Z" fill="url(#ribbonDark)"/>
  </g>
