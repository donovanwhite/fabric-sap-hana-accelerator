  <text x="1390" y="101" class="small">Solution accelerator</text>

  <text x="90" y="175" class="section">SOURCE</text>
  <text x="385" y="175" class="section">INGESTION</text>
  <text x="690" y="175" class="section">MEDALLION LAKEHOUSES</text>
  <text x="1260" y="175" class="section">CONSUMPTION</text>

  <g filter="url(#shadow)">
