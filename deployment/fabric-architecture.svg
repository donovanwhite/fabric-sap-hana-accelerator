    <circle cx="125" cy="270" r="31" fill="#0b74de"/>
    <path d="M108 258h34v24h-34zm5-8h24v8h-24z" fill="#fff" opacity=".95"/>
    <text x="170" y="265" class="card-title">SAP Finance</text>
    <text x="100" y="330" class="card-text">Finance transactions</text>
    <text x="100" y="360" class="card-text">Plans and master data</text>
    <rect x="98" y="392" width="194" height="26" rx="13" fill="#153b64"/>
    <text x="195" y="410" text-anchor="middle" class="pill">13 SOURCE TABLES</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="210" width="260" height="220" rx="28" fill="#11161a" stroke="#6bcbb2" stroke-width="2"/>
    <circle cx="422" cy="270" r="31" fill="url(#fabric)"/>
    <path d="M407 270h30m-15-15v30" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="466" y="265" class="card-title">Full Snapshot</text>
    <text x="466" y="292" class="small">Fabric orchestration</text>
    <text x="397" y="340" class="card-text">JDBC to Fabric SQL</text>
    <text x="397" y="368" class="card-text">One run date</text>
    <rect x="397" y="392" width="196" height="26" rx="13" fill="#1f4f46"/>
    <text x="495" y="410" text-anchor="middle" class="pill">NO CDC ASSUMPTION</text>
  </g>

  <path d="M320 320 H365" class="line"/>

  <g filter="url(#shadow)">
