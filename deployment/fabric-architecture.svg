    <text x="1350" y="467" class="small">Power BI insights</text>
    <text x="1295" y="511" class="card-text">Actual · plan · vendor · GL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1260" y="580" width="270" height="170" rx="26" fill="#11161a" stroke="#93e1b0" stroke-width="2"/>
    <circle cx="1310" cy="632" r="25" fill="#6ab98b"/>
    <path d="M1298 624h24v17h-11l-7 7v-7h-6z" fill="#fff"/>
    <text x="1350" y="627" class="card-title">Finance Agent</text>
    <text x="1350" y="654" class="small">Grounded NL2SQL</text>
    <text x="1295" y="696" class="card-text">Instructions · topics · examples</text>
    <text x="1295" y="723" class="card-text">Synthetic-data safeguards</text>
  </g>

  <path d="M1210 625 H1235 V285 H1260" class="line"/>
  <path d="M1210 665 H1260" class="line"/>
  <path d="M1395 360 V395" class="thin-line"/>

  <g filter="url(#shadow)">
    <rect x="70" y="520" width="650" height="230" rx="30" fill="#0f1014" stroke="#2d3354" stroke-width="2"/>
    <text x="105" y="570" class="section">ONE-COMMAND DEPLOYMENT</text>
    <text x="105" y="614" class="card-title">Fabric REST Installer</text>
    <text x="105" y="648" class="card-text">Creates and binds every Fabric item</text>
    <text x="105" y="680" class="card-text">Seeds SAP_FIN_DB and validates deployment</text>
    <rect x="105" y="708" width="455" height="28" rx="14" fill="#173e37"/>
    <text x="332" y="727" text-anchor="middle" class="pill">EXISTING WORKSPACE · CONTRIBUTOR ACCESS</text>
  </g>

  <path d="M720 635 H815" class="thin-line"/>

  <text x="80" y="842" class="small">Correctness first: full SAP snapshots handle missing technical change timestamps.</text>
  <text x="1520" y="842" text-anchor="end" class="small">Microsoft Fabric · OneLake · Power BI</text>
</svg>
