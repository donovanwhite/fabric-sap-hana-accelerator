    <text x="710" y="260" class="card-title">Bronze</text>
    <text x="710" y="288" class="small" style="fill:#fff3d1">lh_brz_slv_finance / Files</text>
    <text x="710" y="335" class="card-text">Dated source snapshots</text>
    <text x="710" y="363" class="card-text">One-period replay window</text>
    <rect x="710" y="392" width="180" height="26" rx="13" fill="#78350f" opacity=".76"/>
    <text x="800" y="410" text-anchor="middle" class="pill">SOURCE-SHAPED CSV</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="210" width="250" height="220" rx="28" fill="url(#silver)" stroke="#e2e8f0" stroke-width="2"/>
    <text x="995" y="260" class="dark-title">Silver</text>
    <text x="995" y="288" class="dark-small">slv · quarantine · audit</text>
    <text x="995" y="335" class="dark-text">Business-key MERGE</text>
    <text x="995" y="363" class="dark-text">DQ gates and lineage</text>
    <rect x="995" y="392" width="180" height="26" rx="13" fill="#475569" opacity=".8"/>
    <text x="1085" y="410" text-anchor="middle" class="dark-pill">CURRENT STATE</text>
  </g>

  <path d="M625 320 H675" class="line"/>
  <path d="M925 320 H960" class="line"/>

  <g filter="url(#shadow)">
    <rect x="815" y="500" width="395" height="250" rx="30" fill="url(#gold)" stroke="#fde68a" stroke-width="2"/>
    <text x="855" y="555" class="dark-title">Gold Finance Model</text>
    <text x="855" y="585" class="dark-small">lh_gld_finance</text>
    <text x="855" y="630" class="dark-text">9 conformed SCD2 dimensions</text>
    <text x="855" y="660" class="dark-text">2 atomic Finance facts</text>
    <text x="855" y="690" class="dark-text">4 Materialized Lake Views</text>
    <rect x="855" y="712" width="250" height="26" rx="13" fill="#92400e" opacity=".68"/>
    <text x="980" y="730" text-anchor="middle" class="dark-pill">KIMBALL FACT CONSTELLATION</text>
  </g>

  <path d="M1085 430 V500" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1260" y="210" width="270" height="150" rx="26" fill="#11161a" stroke="#80ddc2" stroke-width="2"/>
    <circle cx="1310" cy="260" r="25" fill="#5dbba3"/>
    <path d="M1298 260l8 8 17-18" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1350" y="255" class="card-title">Semantic Model</text>
    <text x="1350" y="282" class="small">Direct Lake on SQL</text>
    <text x="1295" y="326" class="card-text">Measures · relationships · en-ZA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1260" y="395" width="270" height="150" rx="26" fill="#11161a" stroke="#6bcbb2" stroke-width="2"/>
    <circle cx="1310" cy="445" r="25" fill="#3f8f7b"/>
    <path d="M1298 458v-18m10 18v-30m10 30v-12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
